<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Alert App - Darty</title>
    <link rel="stylesheet" href="style.css">
    <!-- Local libraries will be loaded in script.js -->
</head>
<body>
    <!-- Animated Banner -->
    <header class="banner">
        <div class="banner-content">
            <div class="logo-container">
                <h1 class="logo">DARTY</h1>
                <div class="logo-animation"></div>
            </div>
            <div class="datetime-container">
                <div id="current-time" class="time-display"></div>
                <div id="current-date" class="date-display"></div>
                <div id="day-period" class="period-display"></div>
            </div>
        </div>
        <div class="banner-animation"></div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-navigation">
        <button class="tab-button active" onclick="showTab('status30')">Statut 30</button>
        <button class="tab-button" onclick="showTab('import')">Import Excel</button>
    </nav>

    <!-- Status 30 Tab -->
    <div id="status30" class="tab-content active">
        <div class="tab-header">
            <h2>Statut des Alertes (30)</h2>
            <button id="send-alerts" class="alert-button">Envoyer Alertes Email</button>
        </div>
        <div class="alerts-container">
            <div class="alerts-grid" id="alerts-grid">
                <!-- Alerts will be generated here -->
            </div>
        </div>
    </div>

    <!-- Import Excel Tab -->
    <div id="import" class="tab-content">
        <div class="tab-header">
            <h2>Import de Fichier Excel</h2>
        </div>
        <div class="import-container">
            <div class="file-upload-area">
                <input type="file" id="excel-file" accept=".xlsx,.xls" />
                <label for="excel-file" class="file-upload-label">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">Cliquez pour sélectionner un fichier Excel</div>
                    <div class="upload-subtext">Formats supportés: .xlsx, .xls</div>
                </label>
            </div>
            <div class="file-info" id="file-info" style="display: none;">
                <h3>Informations du fichier:</h3>
                <div id="file-details"></div>
                <button id="process-file" class="process-button">Traiter le fichier</button>
            </div>
            <div class="processing-status" id="processing-status"></div>
        </div>
    </div>

    <!-- Email Configuration Modal -->
    <div id="email-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configuration Email</h2>
            <form id="email-config">
                <div class="form-group">
                    <label for="emailjs-service">Service ID EmailJS:</label>
                    <input type="text" id="emailjs-service" placeholder="Entrez votre Service ID" required>
                </div>
                <div class="form-group">
                    <label for="emailjs-template">Template ID:</label>
                    <input type="text" id="emailjs-template" placeholder="Entrez votre Template ID" required>
                </div>
                <div class="form-group">
                    <label for="emailjs-user">User ID:</label>
                    <input type="text" id="emailjs-user" placeholder="Entrez votre User ID" required>
                </div>
                <div class="form-group">
                    <label for="recipient-email">Email destinataire:</label>
                    <input type="email" id="recipient-email" placeholder="email@example.com" required>
                </div>
                <button type="submit">Sauvegarder Configuration</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
