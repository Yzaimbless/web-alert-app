<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Alert App - Darty</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS library for Excel file reading -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- Animated Banner -->
        <header class="banner">
            <div class="banner-content">
                <div class="logo-container">
                    <h1 class="logo">DARTY</h1>
                    <div class="logo-animation"></div>
                </div>
                <div class="datetime-container">
                    <div id="current-time" class="time-display"></div>
                    <div id="current-date" class="date-display"></div>
                    <div id="day-period" class="period-display"></div>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tab-navigation">
            <button class="tab-button active" onclick="showTab('status30', event)">Statut 30</button>
            <button class="tab-button" onclick="showTab('import', event)">Import Excel</button>
        </nav>

        <!-- Content Wrapper -->
        <div class="content-wrapper">
            <!-- Status 30 Tab -->
            <div id="status30" class="tab-content active">
                <div class="tab-header">
                    <h2>Statut des Alertes (30)</h2>
                </div>
                <div class="alerts-container">
                    <div class="alerts-grid" id="alerts-grid">
                        <!-- Alerts will be generated here -->
                    </div>
                </div>
            </div>

            <!-- Import Excel Tab -->
            <div id="import" class="tab-content">
                <div class="tab-header">
                    <h2>Import de Fichier Excel</h2>
                </div>
                <div class="import-container">
                    <div class="file-upload-area">
                        <input type="file" id="excel-file" accept=".xlsx,.xls" />
                        <label for="excel-file" class="file-upload-label">
                            <div class="upload-icon">📁</div>
                            <div class="upload-text">Cliquez pour sélectionner un fichier Excel</div>
                            <div class="upload-subtext">Formats supportés: .xlsx, .xls</div>
                        </label>
                    </div>
                    <div class="file-info" id="file-info" style="display: none;">
                        <h3>Informations du fichier:</h3>
                        <div id="file-details"></div>
                        <button id="process-file" class="process-button">Traiter le fichier</button>
                    </div>
                    <div class="processing-status" id="processing-status"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-stars">
            <div class="footer-star"></div>
            <div class="footer-star"></div>
            <div class="footer-star"></div>
        </div>
        <div class="footer-content">
            <div class="footer-center-info">
                <div class="center-badge">
                    <span class="center-icon">🏢</span>
                    <span class="center-text">Centre GRF Mitry</span>
                </div>
            </div>
            <div class="developer-info">
                <div class="developer-title">Développé par</div>
                <div class="developer-name">Willem Leopold</div>
                <div class="contributor-name">Contributeur: Michael Poitrault</div>
                <div class="social-tag">@darty2025</div>
            </div>
            <div class="footer-year">
                © 2025 - Web Alert App | Darty
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Update date/time display
        function updateDateTime() {
            const now = new Date();
            const timeElement = document.getElementById('current-time');
            const dateElement = document.getElementById('current-date');
            const periodElement = document.getElementById('day-period');
            
            if (timeElement) {
                timeElement.textContent = now.toLocaleTimeString('fr-FR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
            
            if (dateElement) {
                dateElement.textContent = now.toLocaleDateString('fr-FR', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }
            
            if (periodElement) {
                const hour = now.getHours();
                let period = hour < 12 ? 'Matin' : (hour < 18 ? 'Après-midi' : 'Soir');
                periodElement.textContent = period;
            }
        }
        
        // Tab switching function
        function showTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            const tabElement = document.getElementById(tabName);
            if (tabElement) {
                tabElement.classList.add('active');
            }
            
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }
        
        // Initialize time display
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
